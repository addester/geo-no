name: Build & publish (Android app + extension)
# Every push to main builds the Android APK and the extension zips, then publishes them on the
# GitHub release named after the extension version (e.g. v0.2.0). Re-runs replace the files.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detection tests (extension + Android port)
        run: |
          node tests/classifier.test.js
          bash scripts/test-java.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          set -o pipefail
          cd android && gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Collect files
        id: files
        run: |
          bash scripts/build.sh
          cp android/app/build/outputs/apk/release/app-release.apk dist/geo-no-android.apk
          echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
          ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.files.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Geo No v${{ steps.files.outputs.version }}
          make_latest: true
          files: |
            dist/geo-no-android.apk
            dist/geo-no-extension.zip
            dist/geo-no-store-upload.zip
          body: |
            **Block Instagram Reels and YouTube Shorts by country.**

            📱 **Android:** download `geo-no-android.apk` below and open it. Then open Geo No and follow the steps to switch it on. Setup guide: https://addester.github.io/geo-no/#android
            🍏 **iPhone / any phone:** use the web app at https://addester.github.io/geo-no/app/
            💻 **Chrome / Edge / Brave:** download `geo-no-extension.zip`, unzip, then Load unpacked at chrome://extensions.

            New in this version: Instagram Reels (extension), the Android app, and the mobile web app.
      - name: Save build log for debugging
        if: failure()
        run: |
          [ -f build.log ] || echo "no build log (failed before the build step)" > build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/log/build.log build.log
          tail -c 60000 build.log > build-tail.log
          git add build.log build-tail.log
          git commit -qm "CI build log for ${{ github.sha }}"
          git push -f origin ci-logs
